# Host publish stays loopback. Do NOT change ports to 0.0.0.0.
# Inside the container the process must listen on 0.0.0.0 so Docker can forward.
# Default image: PG/MySQL drivers + config UI (fastapi/uvicorn). No dmPython.
services:
  aidb:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: default
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      AIDB_BIND: "0.0.0.0"
      AIDB_PORT: "8787"
      AIDB_DATA: "/var/lib/aidb"
    volumes:
      - aidb-data:/var/lib/aidb   # overlays/{source_id}/...
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - aidb
volumes:
  aidb-data:
networks:
  aidb:
    ipam:
      config:
        # Fixed private subnet so Docker does not collide with common LANs.
        - subnet: 10.255.200.0/24
